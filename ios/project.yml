name: AmbientFieldLens
options:
  bundleIdPrefix: art.robotross
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "27.1"
packages:
  DATSDK:
    url: https://github.com/facebook/meta-wearables-dat-ios
    version: "1.0.1"
targets:
  AmbientFieldLens:
    type: application
    platform: iOS
    sources:
      - path: AmbientFieldLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.robotross.AmbientFieldLens
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.2"
        INFOPLIST_FILE: AmbientFieldLens/Info.plist
    dependencies:
      - package: DATSDK
        product: MWDATCore
      - package: DATSDK
        product: MWDATCamera
      - package: DATSDK
        product: MWDATDisplay
      - package: DATSDK
        product: MWDATMockDevice
  AmbientFieldLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AmbientFieldLensTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.robotross.AmbientFieldLensTests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.2"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: AmbientFieldLens
schemes:
  AmbientFieldLens:
    build:
      targets:
        AmbientFieldLens: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AmbientFieldLensTests
